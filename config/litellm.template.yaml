# GENERATED by scripts/60-Services.ps1 from config/litellm.template.yaml
# LiteLLM runs in WSL2 Docker on the host network (mirrored), so 127.0.0.1:8080 is the
# native Windows llama-swap and {{SPARK_HOST}} resolves through Tailscale MagicDNS.
#
# Routing policy:
#   sc-*     laptop models (NDA research; the only option offline)
#   spark/*  anything served by the DGX Spark's own LiteLLM (big models) - same NDA zone, on-prem
# Claude itself is NOT routed here: the Max plan is used by Claude Code's own login.
#
# Rendered twice by 60-Services:
#   litellm.yaml      everyday gateway :4000 - Spark key SPARK_LITELLM_KEY, traces to Langfuse if configured
#   litellm-nda.yaml  NDA gateway :4001 (NDA sessions only) - Spark key SPARK_NDA_LITELLM_KEY (the Spark's
#                     no-content-logging key), NO callbacks. `ccn` (Claude Code on local models) and the
#                     planning pipeline use this one.
# Both also answer Anthropic-format requests (/v1/messages), which is how Claude Code talks to them.

model_list:
  # ---------------------------------------------------------------- local (llama-swap)
  - model_name: sc-research
    litellm_params: { model: openai/sc-research, api_base: "http://127.0.0.1:8080/v1", api_key: "none", timeout: 1800 }
    model_info: { mode: chat }
  - model_name: sc-analyst
    litellm_params: { model: openai/sc-analyst, api_base: "http://127.0.0.1:8080/v1", api_key: "none" }
    model_info: { mode: chat }
  - model_name: sc-research-alt
    litellm_params: { model: openai/sc-research-alt, api_base: "http://127.0.0.1:8080/v1", api_key: "none", timeout: 1800 }
    model_info: { mode: chat }
  - model_name: sc-fast
    litellm_params: { model: openai/sc-fast, api_base: "http://127.0.0.1:8080/v1", api_key: "none" }
    model_info: { mode: chat }
  - model_name: sc-embed
    litellm_params: { model: openai/sc-embed, api_base: "http://127.0.0.1:8080/v1", api_key: "none" }
    model_info: { mode: embedding }
  # Reranking: call llama-swap directly at http://127.0.0.1:8080/v1/rerank with model "sc-rerank".

  # ---------------------------------------------------------------- DGX Spark (network peer)
  # Wildcard: a request for "spark/<name>" is forwarded as "<name>" to the Spark's gateway.
  - model_name: "spark/*"
    litellm_params:
      model: "openai/*"
      api_base: "{{SPARK_LITELLM_URL}}"
      api_key: "os.environ/{{SPARK_KEY_ENV}}"
      timeout: 900

router_settings:
  num_retries: 1
  # When the Spark is unreachable (travel), fail fast rather than hang.
  timeout: 900

litellm_settings:
  drop_params: true
  request_timeout: 900
{{LANGFUSE_BLOCK}}
general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
