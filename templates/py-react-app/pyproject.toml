[project]
name = "app"
version = "0.1.0"
description = "Python API with a bundled React UI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
app = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
# the built UI is git-ignored but must ship in the wheel
artifacts = ["src/app/static/**"]

[tool.ruff]
line-length = 110
