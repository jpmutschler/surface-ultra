# Zadig preset: Quarch Torridon Cable Pull MiniSAS on Windows ARM64 (Quarch's INF has no NTarm64 section).
# Binds the inbox WinUSB driver with Quarch's device interface GUID so Quarch software finds it.
# Zadig: Device > Load Preset Device > this file, driver = WinUSB, Install Driver.
[device]
  Description = "Torridon Cable Pull MiniSAS"
  VID = 0x16D0
  PID = 0x0445
  GUID = "{B5656C5D-5F67-4ACE-BA3B-E8906DEE3538}"
